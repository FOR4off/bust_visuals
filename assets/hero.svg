<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14141B"/>
      <stop offset="1" stop-color="#0B0B0F"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB63D" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FF7A2F" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#sky)"/>
  <!-- blocky sun -->
  <rect x="940" y="60" width="90" height="90" fill="url(#glow)"/>
  <!-- clouds -->
  <g fill="#1B1B24">
    <rect x="120" y="80" width="180" height="34" rx="6"/>
    <rect x="160" y="60" width="120" height="26" rx="6"/>
    <rect x="620" y="120" width="150" height="30" rx="6"/>
  </g>
  <!-- terrain -->
  <g>
    <rect x="0" y="330" width="1200" height="150" fill="#121218"/>
    <rect x="0" y="310" width="1200" height="24" fill="#17171F"/>
    <rect x="80" y="270" width="60" height="42" fill="#1B1B24"/>
    <rect x="160" y="240" width="60" height="72" fill="#16161d"/>
    <rect x="240" y="285" width="60" height="28" fill="#1D1D26"/>
    <rect x="900" y="255" width="60" height="56" fill="#1B1B24"/>
    <rect x="980" y="285" width="60" height="26" fill="#16161d"/>
    <rect x="1060" y="265" width="60" height="46" fill="#1D1D26"/>
    <!-- tree -->
    <rect x="420" y="230" width="18" height="82" fill="#221a12"/>
    <rect x="392" y="190" width="76" height="48" fill="#16241a"/>
    <rect x="404" y="168" width="52" height="30" fill="#182a1e"/>
  </g>
  <!-- player silhouette with cape + aura particles -->
  <g>
    <circle cx="600" cy="292" r="14" fill="#FFB63D"/>
    <rect x="586" y="308" width="28" height="34" rx="6" fill="#FFB63D"/>
    <rect x="592" y="306" width="12" height="30" rx="4" fill="#FF7A2F"/>
    <rect x="584" y="342" width="10" height="26" rx="4" fill="#FFB63D"/>
    <rect x="606" y="342" width="10" height="26" rx="4" fill="#FFB63D"/>
    <g fill="#FF7A2F" opacity=".7">
      <circle cx="560" cy="300" r="4"/><circle cx="648" cy="288" r="3"/>
      <circle cx="578" cy="262" r="3"/><circle cx="630" cy="258" r="4"/>
      <circle cx="612" cy="382" r="3"/><circle cx="588" cy="386" r="3"/>
    </g>
  </g>
  <!-- ground grid -->
  <g stroke="#26262F" stroke-width="2">
    <line x1="0" y1="370" x2="1200" y2="370"/>
    <line x1="0" y1="410" x2="1200" y2="410"/>
    <line x1="150" y1="330" x2="60" y2="480"/>
    <line x1="450" y1="330" x2="410" y2="480"/>
    <line x1="750" y1="330" x2="760" y2="480"/>
    <line x1="1050" y1="330" x2="1110" y2="480"/>
  </g>
</svg>
